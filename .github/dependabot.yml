# Weekly version bumps for the Python lockfile and GitHub Actions pins.
# Security updates are enabled separately via Dependabot alerts and stay
# ungrouped so they can be merged promptly.
version: 2
updates:
  # uv, not pip: this project locks with uv.lock and CI installs with
  # `uv sync --locked`. The pip ecosystem edits pyproject.toml without
  # regenerating the lock, so every version-update PR it opened failed with
  # "The lockfile at `uv.lock` needs to be updated, but `--locked` was
  # provided" before a human could read it (#180). Security updates already
  # auto-detect uv and were unaffected.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      python-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "ftmon"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      # One weekly PR for all Action pin bumps instead of a spray of majors.
      github-actions:
        patterns:
          - "*"
