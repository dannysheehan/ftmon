# The same gate contributors run locally (README "Development" section).
# Deterministic by design: realsystem tests are deselected by pytest defaults.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra mcp
      - run: uv run ruff check src tests tools
      - run: uv run python tools/gen_reqindex.py --check
      - run: uv run pytest -q
      - run: uv build --clear
      - name: Smoke installed wheel MCP over stdio
        run: |
          ftmon_wheels=(dist/ftmon-*.whl)
          uv run --isolated --no-project \
            --with "${ftmon_wheels[0]}[mcp]" \
            python tools/smoke_mcp.py
      - name: Verify packaged authoring guides
        run: |
          uv run --isolated --no-project --with ./dist/ftmon-*.whl python - <<'PY'
          from ftmon.mcp_server import _guide_text

          expected = {
              "definitions": "complete reference",
              "check-authoring": "Writing an external check",
              "external-checks": "privileged exporter pattern",
          }
          for name, marker in expected.items():
              assert marker in _guide_text(name)
          PY

  windows:
    name: windows (3.12)
    runs-on: windows-latest
    env:
      # Keep Unicode diagnostics (including gen_reqindex's check mark) stable
      # under the Windows runner's legacy console code page.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra mcp
      - run: uv run ruff check src tests tools
      - run: uv run python tools/gen_reqindex.py --check
      - run: uv run pytest -q
      - run: uv build --clear
      - name: Smoke installed wheel MCP over stdio
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/ftmon-*.whl | Select-Object -First 1).FullName
          uv run --isolated --no-project --with "$($wheel)[mcp]" python tools/smoke_mcp.py
      - name: Verify packaged authoring guides
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/ftmon-*.whl | Select-Object -First 1).FullName
          @'
          from ftmon.mcp_server import _guide_text

          expected = {
              "definitions": "complete reference",
              "check-authoring": "Writing an external check",
              "external-checks": "privileged exporter pattern",
          }
          for name, marker in expected.items():
              assert marker in _guide_text(name)
          '@ | uv run --isolated --no-project --with $wheel python -

  macos:
    name: macOS arm64 (3.13)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra mcp
      - run: uv run ruff check src tests tools
      - run: uv run python tools/gen_reqindex.py --check
      - name: Tighten external-check fixture interpreter permissions
        run: |
          interpreter="$(uv run python -c 'import os, sys; print(os.path.realpath(sys.executable))')"
          sudo chmod go-w "$interpreter"
      - run: uv run pytest -q

  macos-intel-install:
    name: macOS Intel core wheel-only install
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
      - run: uv build --wheel --clear
      - name: Install core wheel without source builds
        run: |
          uv run --isolated --no-project --no-build \
            --with ./dist/ftmon-*.whl python - <<'PY'
          import importlib.util
          import io
          from contextlib import redirect_stderr

          import ftmon.cli
          import ftmon.daemon
          import ftmon.mcp_server
          import ftmon.web.app

          assert importlib.util.find_spec("mcp") is None
          assert importlib.util.find_spec("jwt") is None
          assert importlib.util.find_spec("cryptography") is None
          error = io.StringIO()
          with redirect_stderr(error):
              assert ftmon.cli.main(["mcp"]) == 2
          assert "ftmon[mcp]" in error.getvalue()
          PY
