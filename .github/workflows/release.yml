# Tag-driven release: v* tags run the full gate, build sdist+wheel, build and
# smoke-test the Windows ZIP/MSI (blocking), publish to PyPI via Trusted
# Publishing (OIDC), then attach all artifacts to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv sync --locked
      - run: uv run ruff check src tests tools
      - run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv build --clear
      - name: Verify packaged authoring guides
        run: |
          uv run --isolated --no-project --with ./dist/ftmon-*.whl python - <<'PY'
          from ftmon.mcp_server import _guide_text

          expected = {
              "definitions": "complete reference",
              "check-authoring": "Writing an external check",
              "external-checks": "privileged exporter pattern",
          }
          for name, marker in expected.items():
              assert marker in _guide_text(name)
          PY
      - name: Check tag matches package version
        run: |
          version=$(uv run python -c "import ftmon; print(ftmon.__version__)")
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "tag ${GITHUB_REF_NAME} != package version v${version}" >&2
            exit 1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  windows:
    needs: test
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      # Do not set FTMON_SIGN_SKIP here. build_windows signs exe before ZIP/MSI
      # and the MSI afterward when FTMON_SIGN_CERT_SHA1 is configured; otherwise
      # sign_windows no-ops without failing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "9.0.x"
      - name: Read packaging pins from versions.toml
        id: pins
        shell: pwsh
        run: |
          $raw = Get-Content -Raw packaging/windows/versions.toml
          if ($raw -notmatch 'python\s*=\s*"([^"]+)"') { throw "python pin missing" }
          "python=$($Matches[1])" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - run: uv sync --locked --group windows-packaging
      - name: Build onedir ZIP + MSI (sign exe before pack; sign MSI after)
        env:
          FTMON_SIGN_CERT_SHA1: ${{ secrets.FTMON_SIGN_CERT_SHA1 }}
          FTMON_SIGN_TIMESTAMP: ${{ secrets.FTMON_SIGN_TIMESTAMP }}
        run: uv run python tools/windows/build_windows.py
      - name: Agree tag, package, frozen exe, and MSI ProductVersion
        shell: pwsh
        run: |
          $version = uv run python -c "import ftmon; print(ftmon.__version__)"
          $msi = Join-Path "dist/windows" "ftmon-$($version.Trim())-windows-x64.msi"
          uv run python tools/windows/check_version_agreement.py `
            --exe dist/windows/ftmon/ftmon.exe `
            --msi $msi `
            --tag "${{ github.ref_name }}"
      - name: Silent MSI install
        shell: pwsh
        run: |
          $version = uv run python -c "import ftmon; print(ftmon.__version__)"
          $msi = Join-Path "dist/windows" "ftmon-$($version.Trim())-windows-x64.msi"
          if (-not (Test-Path $msi)) { throw "missing $msi" }
          $log = Join-Path $env:RUNNER_TEMP "ftmon-msi-install.log"
          $smokeRoot = Join-Path $env:RUNNER_TEMP "ftmon-smoke"
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          "FTMON_SMOKE_ROOT=$smokeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $p = Start-Process -FilePath msiexec.exe -ArgumentList "/i `"$msi`" /qn /norestart /l*v `"$log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content $log -Tail 80
            throw "msiexec install failed: $($p.ExitCode)"
          }
          $install = Join-Path $env:LOCALAPPDATA "Programs\FTMON"
          if (-not (Test-Path (Join-Path $install "ftmon.exe"))) {
            throw "ftmon.exe missing after install under $install"
          }
      - name: Smoke installed executable (no uv run / no venv ftmon)
        shell: pwsh
        run: |
          $install = Join-Path $env:LOCALAPPDATA "Programs\FTMON"
          $ftmonExe = (Resolve-Path (Join-Path $install "ftmon.exe")).Path
          $env:FTMON_EXE = $ftmonExe
          $repoPython = Join-Path $env:GITHUB_WORKSPACE ".venv\Scripts\python.exe"
          if (-not (Test-Path $repoPython)) { throw "missing $repoPython" }
          $env:Path = "$install;C:\Windows\System32;C:\Windows"
          & $ftmonExe --version
          & $repoPython (Join-Path $env:GITHUB_WORKSPACE "tools\windows\smoke_installed.py")
      - name: Repair + uninstall preserve state
        shell: pwsh
        run: |
          $version = ((& (Join-Path $env:GITHUB_WORKSPACE ".venv\Scripts\python.exe") -c "import ftmon; print(ftmon.__version__)")).Trim()
          $msi = Join-Path "dist/windows" "ftmon-$version-windows-x64.msi"
          $install = Join-Path $env:LOCALAPPDATA "Programs\FTMON"
          $log = Join-Path $env:RUNNER_TEMP "ftmon-msi-repair.log"
          $repair = Start-Process msiexec.exe -ArgumentList "/fa `"$msi`" /qn /l*v `"$log`"" -Wait -PassThru
          if ($repair.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "repair failed" }
          $required = @(
            "ftmon.exe",
            "Install-FTMONTasks.ps1",
            "Invoke-FTMONTask.ps1",
            "LICENSE",
            "THIRD_PARTY_NOTICES.txt"
          )
          foreach ($name in $required) {
            $path = Join-Path $install $name
            if (-not (Test-Path -LiteralPath $path)) { throw "repair missing $name" }
          }
          & (Join-Path $install "ftmon.exe") --version
          $stateMarker = Join-Path $env:FTMON_SMOKE_ROOT "config\config.toml"
          $uninstall = Start-Process msiexec.exe -ArgumentList "/x `"$msi`" /qn /l*v `"$log`"" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "uninstall failed" }
          if (Test-Path -LiteralPath $install) { throw "install directory survived uninstall: $install" }
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $normalized = ($install.TrimEnd('\'))
          $survived = ($userPath -split ';') | Where-Object {
            $_ -and (($_.TrimEnd('\')) -ieq $normalized)
          }
          if ($survived) { throw "exact PATH entry survived uninstall: $normalized" }
          if (-not (Test-Path $stateMarker)) { throw "user state was removed by uninstall" }
      - name: Synthetic MSI lifecycle (upgrade / downgrade / rollback)
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "ftmon-msi-lifecycle"
          & (Join-Path $env:GITHUB_WORKSPACE ".venv\Scripts\python.exe") `
            (Join-Path $env:GITHUB_WORKSPACE "tools\windows\msi_lifecycle_test.py") `
            --work-dir $work
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-dist
          path: |
            dist/windows/*.zip
            dist/windows/*.msi
            dist/windows/SHA256SUMS.txt

  publish-pypi:
    needs: [build, windows]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ftmon
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: [publish-pypi, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-dist
          path: dist/windows/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *a*|*b*|*rc*) prerelease="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" dist/* dist/windows/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes ${prerelease}
