title = "NVIDIA GPU health"
summary = "Track one NVIDIA GPU's temperature, utilization, memory and power, with confirmed heat and check-health alerts."
kind = "ftmon-json"
platforms = ["linux"]
upstream = "https://github.com/dannysheehan/ftmon/tree/main/extra-monitors/nvidia-gpu"
