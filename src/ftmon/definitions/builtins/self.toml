# FTMON built-in: self-monitoring (SPEC 7.7 / RB-02)
# The monitor must not become the hog; if it does, it tells on itself.
# Always installed; tunable, not deletable.
schema = 1

[monitor]
name = "self"
description = "FTMON watches its own resource budget and pipeline health"
version = 3
enabled = true
platforms = ["linux"]
interval = "60s"
source = "self"

[parameters]
cpu_budget_pct = { value = 1.5, doc = "Warn when daemon CPU%% (10m avg) exceeds this (RB-01 is 1.0)" }
rss_budget_mb = { value = 100, doc = "Warn when daemon RSS exceeds this (MB)" }
db_budget_mb = { value = 200, doc = "DM-05's normative enforcement target (used pages, not file size); retention is tuned to hold used bytes just under this" }
# DM-05 defines the budget as USED pages, (page_count - freelist_count) *
# page_size -- free pages are already reclaimed and cost nothing against it.
# db_warn_mb sits ~15%% above db_budget_mb on purpose: db_budget_mb is the
# target retention holds the footprint under, so an alarm AT that value
# fires every time retention is doing its job correctly. db_warn_mb means
# "retention is failing," not "retention is working."
db_warn_mb = { value = 230, doc = "Alarm threshold for db-budget, deliberately above db_budget_mb (see comment above)" }
stall_s = { value = 600, doc = "Warn when the event reader has been silent this long (s)" }
# --- RSS growth (#106) -------------------------------------------------
# rss-budget above is a *level* backstop: it fires once RSS is already over
# budget. These catch the approach, so an operator sees a trend rather than
# an arrival. Sized against rss_budget_mb, not guessed: 1 MB/h is 24 MB/day,
# roughly a quarter of the 100 MB budget per day, which no healthy daemon
# should sustain. Deliberately NOT tuned to alarm on the ~0.6 MB/h a 24-hour
# canary measured -- that rise is real but not yet shown to be pathological,
# and a threshold set to make today's reading fire proves nothing tomorrow.
rss_growth_warn_mb_per_h = { value = 1.0, doc = "Warn when daemon RSS grows faster than this (MB/hour), sustained" }
rss_growth_crit_mb_per_h = { value = 4.0, doc = "Error when daemon RSS grows this fast (MB/hour) - 96 MB/day, essentially the whole budget in a day" }
rss_growth_min_coverage = { value = 0.8, doc = "Fraction of the 6h slope window that must actually be observed - otherwise a restart or a gap can pass for a six-hour verdict" }
rss_growth_min_net_mb = { value = 4, doc = "Net RSS growth (MB) the 6h window must show - a rise that has since fallen back is not growth" }
rss_growth_confidence = { value = 0.7, doc = "Fraction of rising samples used as the trend-profile confidence signal (not an alert gate)" }

[[rule]]
id = "cpu-budget"
group = "cpu-budget"
when = 'avg(cpu_pct, "10m") > cpu_budget_pct'
severity = "warning"
confirm_cycles = 3
message = "FTMON over CPU budget: {cpu_10m:.1f}% (10m avg)"

[[rule]]
id = "rss-budget"
group = "rss-budget"
when = 'rss_bytes > rss_budget_mb * MB'
severity = "warning"
confirm_cycles = 5
message = "FTMON over memory budget: {rss_mb:.0f} MB RSS"

# Fires on db_used_bytes (DM-05: used pages), not db_bytes (file size) --
# free pages are immediately reusable and cost nothing against the budget,
# so gating on file size flapped on a live host that was over the file
# threshold while comfortably under the used-bytes budget.
[[rule]]
id = "db-budget"
group = "db-budget"
when = 'db_used_bytes > db_warn_mb * MB'
severity = "warning"
confirm_cycles = 3
message = "FTMON database over budget: {db_used_mb:.0f} MB used (pruning should engage)"

# Own incident group (RB-02): sharing rss-budget would let one incident stay
# open while ownership moved between "over budget" and "growing", so its
# duration and recovery history would describe nothing in particular.
#
# Gated on coverage and net delta before the slope is trusted, exactly as
# leak.toml does: coverage rejects a verdict resting on a handful of samples
# after a restart, and net delta rejects a sawtooth that has already fallen
# back. Growth confidence is deliberately NOT a gate -- a stepwise leak
# (grow, plateau, grow) scores low on consecutive-delta confidence while
# being precisely what this must catch; it stays the trend signal only.
#
# The net-delta gate is defence in depth inherited from leak.toml and is not
# isolated by any test: for a series ending near where it started the fitted
# slope is also near zero, so slope rejects first. Removing it breaks no
# test. Kept for consistency with leak.toml, not because it is load-bearing
# here (#106 review).
[[rule]]
id = "rss-growth-warn"
group = "rss-growth"
when = 'coverage(rss_bytes, "6h") >= rss_growth_min_coverage and delta(rss_bytes, "6h") > rss_growth_min_net_mb * MB and slope(rss_bytes, "6h") * 3600 > rss_growth_warn_mb_per_h * MB'
severity = "warning"
confirm_cycles = 10
message = "FTMON RSS growing: {rss_slope_mbph:.1f} MB/h sustained (now {rss_mb:.0f} MB)"

[[rule]]
id = "rss-growth-crit"
group = "rss-growth"
when = 'coverage(rss_bytes, "6h") >= rss_growth_min_coverage and delta(rss_bytes, "6h") > rss_growth_min_net_mb * MB and slope(rss_bytes, "6h") * 3600 > rss_growth_crit_mb_per_h * MB'
severity = "error"
confirm_cycles = 10
message = "FTMON RSS growing fast: {rss_slope_mbph:.1f} MB/h sustained (now {rss_mb:.0f} MB)"

[[rule]]
id = "event-stall"
when = 'source_activity_age_s > stall_s'
severity = "warning"
confirm_cycles = 2
message = "Event reader silent for {source_activity_age_s:.0f}s"

[[derived]]
name = "cpu_10m"
expr = 'avg(cpu_pct, "10m")'

[[derived]]
name = "rss_mb"
expr = 'rss_bytes / MB'

[[derived]]
name = "db_used_mb"
expr = 'db_used_bytes / MB'

[[derived]]
name = "rss_slope_mbph"
expr = 'slope(rss_bytes, "6h") * 3600 / MB'

[[derived]]
name = "rss_growth_conf"
expr = 'monot(rss_bytes, "6h")'

# Signed on purpose: retention pushing the footprint back down is the
# interesting case, and clamping at zero would erase it (DM-05).
[[derived]]
name = "db_used_slope_mbph"
expr = 'slope(db_used_bytes, "6h") * 3600 / MB'

[[derived]]
name = "db_headroom_mb"
expr = 'db_headroom_bytes / MB'

[[trend]]
id = "rss-growth"
kind = "growth"
title = "FTMON memory growth"
value_metric = "rss_mb"
value_unit = "MiB"
rate_metric = "rss_slope_mbph"
rate_unit = "MiB/hour"
confidence_metric = "rss_growth_conf"
confidence_threshold_param = "rss_growth_confidence"
rate_threshold_params = ["rss_growth_warn_mb_per_h", "rss_growth_crit_mb_per_h"]
incident_group = "rss-growth"

# Capacity, not growth: the question is headroom against DM-05's target, and
# the rate may legitimately be negative when retention is winning.
[[trend]]
id = "db-capacity"
kind = "capacity"
title = "FTMON database capacity"
value_metric = "db_used_mb"
value_unit = "MiB"
rate_metric = "db_used_slope_mbph"
rate_unit = "MiB/hour"
remaining_metric = "db_headroom_mb"
value_threshold_params = ["db_budget_mb", "db_warn_mb"]
incident_group = "db-budget"
