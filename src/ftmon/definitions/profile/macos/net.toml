# FTMON built-in: sockets (SPEC 7.7.7)
# Expected listeners are watchlist targets; connection totals are baselined.
# Per-process attribution is deliberately out of scope in v1 (NG-06).
schema = 1

[monitor]
name = "net"
description = "Expected listener availability"
version = 2
enabled = true
platforms = ["darwin"]
interval = "60s"
source = "net"

[source_options]
watchlist = [
  # { listen = "tcp:22" },
  # { listen = "tcp:8420" },
]

[[rule]]
id = "listener-down"
when = 'present == 0'
severity = "error"
confirm_cycles = 2
message = "Expected listener {entity} is not listening"
