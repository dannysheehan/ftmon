# FTMON built-in: journal/event-log entries of interest (SPEC 7.7.3)
# Event rules open "episodes" (IN-08): a matching event opens/refreshes an
# incident; it clears after clear_after with no matching events.
schema = 1

[monitor]
name = "events"
description = "Raises incidents for macOS unified-log entries of interest"
version = 4
enabled = true
platforms = ["darwin"]
source = "events"

[source_options]
# The macOS adapter applies its fixed operational predicate before ingestion.
# Retain only fault records unless one of the explicit rules below matches.
store_min_severity = "critical"

[[rule]]
id = "third-party-fault"
when = 'event_id == "third-party-fault"'
severity = "critical"
cooldown = "10m"
clear_after = "30m"
message = "Third-party macOS fault from {provider}: {message}"

[[rule]]
id = "storage-integrity"
when = 'event_id == "storage-integrity"'
severity = "critical"
cooldown = "10m"
clear_after = "30m"
message = "macOS storage integrity warning: {message}"
