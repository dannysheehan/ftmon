# FTMON built-in: system-wide pressure (SPEC 7.7.5)
# "Why is the whole desktop sluggish" — as opposed to blaming one process.
# Windows has no PSI equivalent, so its profile retains only the native
# available-memory rule. Structurally absent PSI branches are removed rather
# than left permanently UNKNOWN, and raw CPU utilization is not substituted
# for scheduler stall pressure (EX-06/SA-04).
schema = 1

[monitor]
name = "load"
description = "System-wide memory pressure"
version = 4
enabled = true
platforms = ["windows"]
interval = "60s"
source = "system"

[parameters]
mem_avail_pct_warn = { value = 5, doc = "Warn when available memory drops below this percent of total" }

[glance]
metric = "mem_avail_pct"
unit = "percent"
aggregate = "min"
thresholds = [
  { label = "warn", parameter = "mem_avail_pct_warn" },
]

[[rule]]
id = "pressure-warn"
group = "pressure"
when = 'pct(mem_available_bytes, mem_total_bytes) < mem_avail_pct_warn'
severity = "warning"
confirm_cycles = 5
message = "System under pressure: {mem_avail_pct:.0f}% memory available"

[[derived]]
name = "mem_avail_pct"
expr = 'pct(mem_available_bytes, mem_total_bytes)'
