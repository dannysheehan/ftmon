# FTMON built-in: CPU hog detector (SPEC 7.7.2)
schema = 1
# NOTE: exempt is a top-level key, so it must appear BEFORE the first [table]
# header - TOML binds bare keys to the most recently opened table otherwise.
#
# System Idle Process (PID 0) is exempted by default on Windows: psutil
# reports its cpu_pct as accumulated idle time across all cores, not real
# load, so it trivially exceeds any "hog" threshold whenever the machine is
# mostly idle -- confirmed on a real overnight run, where it opened a
# permanently-stuck critical incident at cpu_pct up to 1795% (avg 1668%).
# Not a platform conditional (PL-01): this entity only ever appears via
# psutil on Windows, so the regex is inert everywhere else regardless.
exempt = [ 'matches(name, "^System Idle Process$")' ]

[monitor]
name = "hog"
description = "Detects processes with sustained high CPU use"
version = 3
enabled = true
platforms = ["windows"]
interval = "60s"
source = "process"

[parameters]
warn_pct = { value = 80, doc = "Warn when average CPU%% over 5m exceeds this" }
crit_pct = { value = 90, doc = "Error when average CPU%% over 15m exceeds this" }

# The warning and critical rules use different windows, so only the matching
# five-minute warning threshold belongs beside this five-minute readout.
[glance]
metric = "cpu_5m"
unit = "percent"
aggregate = "max"
thresholds = [
  { label = "warn", parameter = "warn_pct" },
]

# Legit heavy lifters — uncomment to silence compilers/encoders:
# exempt = [ 'matches(name, "^(cc1|cc1plus|rustc|ld|clang|make|cargo|ffmpeg)$")' ]

[[rule]]
id = "hog-warn"
group = "hog"
when = 'avg(cpu_pct, "5m") > warn_pct'
severity = "warning"
confirm_cycles = 5
message = "{entity} hogging CPU: {cpu_5m:.0f}% avg over 5m"

[[rule]]
id = "hog-crit"
group = "hog"
when = 'avg(cpu_pct, "15m") > crit_pct'
severity = "error"
confirm_cycles = 5
message = "{entity} pegging CPU: {cpu_15m:.0f}% avg over 15m"

[[derived]]
name = "cpu_5m"
expr = 'avg(cpu_pct, "5m")'

[[derived]]
name = "cpu_15m"
expr = 'avg(cpu_pct, "15m")'
