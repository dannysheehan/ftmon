# FTMON built-in: self-monitoring (SPEC 7.7 / RB-02)
# The monitor must not become the hog; if it does, it tells on itself.
# Always installed; tunable, not deletable.
schema = 1

[monitor]
name = "self"
description = "FTMON watches its own resource budget and pipeline health"
version = 4
enabled = true
platforms = ["linux"]
interval = "60s"
source = "self"

[parameters]
cpu_budget_pct = { value = 1.5, doc = "Warn when daemon CPU%% (10m avg) exceeds this (RB-01 is 1.0)" }
rss_budget_mb = { value = 100, doc = "Warn when daemon RSS exceeds this (MB)" }
db_budget_mb = { value = 200, doc = "DM-05's normative enforcement target (used pages, not file size); retention is tuned to hold used bytes just under this" }
# DM-05 defines the budget as USED pages, (page_count - freelist_count) *
# page_size -- free pages are already reclaimed and cost nothing against it.
# db_warn_mb sits ~15%% above db_budget_mb on purpose: db_budget_mb is the
# target retention holds the footprint under, so an alarm AT that value
# fires every time retention is doing its job correctly. db_warn_mb means
# "retention is failing," not "retention is working."
db_warn_mb = { value = 230, doc = "Alarm threshold for db-budget, deliberately above db_budget_mb (see comment above)" }
stall_s = { value = 600, doc = "Warn when the event reader has been silent this long (s)" }
# --- RSS exhaustion horizons (#106) ------------------------------------
# rss-budget above is a *level* backstop: it fires once RSS is already over
# budget. These catch the approach, so an operator sees a trend rather than
# an arrival.
#
# Horizons, not rates. A 59-hour canary soak grew steadily at ~0.42 MB/h
# from 55 MB to a 100 MB breach while a fixed 1 MB/h threshold never fired.
# The same rate is unremarkable with 45 MB of headroom and terminal with 3,
# so what matters is how long the trend takes to consume what is left.
#
# There is no clear_cycles parameter: the loader accepts only a literal int
# there, so a parameter could be declared but never referenced. The value
# lives on the rules, with its rationale above them.
rss_exhaustion_warn_h = { value = 72, doc = "Warn when the 6h trend would consume all remaining RSS headroom within this many hours" }
rss_exhaustion_crit_h = { value = 24, doc = "Error when the 6h trend would consume all remaining headroom within this many hours" }
rss_growth_min_coverage = { value = 0.8, doc = "Fraction of the 6h slope window that must actually be observed - otherwise a restart or a gap can pass for a six-hour verdict" }
rss_growth_confidence = { value = 0.7, doc = "Fraction of rising samples used as the trend-profile confidence signal (not an alert gate)" }

[[rule]]
id = "cpu-budget"
group = "cpu-budget"
when = 'avg(cpu_pct, "10m") > cpu_budget_pct'
severity = "warning"
confirm_cycles = 3
message = "FTMON over CPU budget: {cpu_10m:.1f}% (10m avg)"

[[rule]]
id = "rss-budget"
group = "rss-budget"
when = 'rss_bytes > rss_budget_mb * MB'
severity = "warning"
confirm_cycles = 5
message = "FTMON over memory budget: {rss_mb:.0f} MB RSS"

# Fires on db_used_bytes (DM-05: used pages), not db_bytes (file size) --
# free pages are immediately reusable and cost nothing against the budget,
# so gating on file size flapped on a live host that was over the file
# threshold while comfortably under the used-bytes budget.
[[rule]]
id = "db-budget"
group = "db-budget"
when = 'db_used_bytes > db_warn_mb * MB'
severity = "warning"
confirm_cycles = 3
message = "FTMON database over budget: {db_used_mb:.0f} MB used (pruning should engage)"

# Own incident group (RB-02): sharing rss-budget would let one incident stay
# open while ownership moved between "over budget" and "growing", so its
# duration and recovery history would describe nothing in particular.
#
# v4 replaces a fixed MB/hour threshold with projected exhaustion. A 59-hour
# canary soak grew linearly at ~0.42 MB/h from 55 MB to a 100 MB breach while
# the 1.0 MB/h gate never fired -- correctly, by its own definition. No fixed
# rate can work: 0.42 MB/h is benign with 45 MB of headroom and terminal with
# 3 MB, and the threshold cannot see the difference. Headroom can.
#
# Stated as a multiplication, never a division: `headroom < slope x hours`
# rather than `headroom / slope < hours`. Slope crosses zero routinely on a
# flat daemon, and EX-06 would turn each division by ~0 into an UNKNOWN plus
# a counter tick rather than a decision.
#
# Positive headroom is required so this hands off cleanly: once RSS is
# actually over budget the prediction is spent and rss-budget owns it.
#
# There is deliberately no separate `slope > 0` guard: the multiplication
# form already is one. A negative slope makes `slope x hours` negative, and
# positive headroom is never less than a negative number, so the comparison
# cannot fire on shrinking memory. An explicit guard would be dead
# expression -- no mutation of it changes any outcome.
#
# The v3 net-growth gate of 4 MB is deliberately NOT carried over. At the
# 0.42 MB/h the soak measured, six hours of growth is ~2.5 MB -- the gate
# would have rejected the very trend this rule exists to catch, recreating
# the blind spot in a new place. Positive net growth is required instead,
# which still rejects a rise that has fallen back.
#
# clear_cycles is the hysteresis. Headroom shrinks as RSS climbs, so
# projected time falls even at constant slope and the rule grows more eager
# near the budget -- desirable, but it puts the condition close to its own
# boundary where 6h slope noise (0.23-0.64 MB/h observed) can flap it. 30
# cycles is 30 minutes of continuous quiet and is PROVISIONAL: backtesting
# against rollup5m history should decide between roughly 10 and 30.
[[rule]]
id = "rss-growth-warn"
group = "rss-growth"
when = 'coverage(rss_bytes, "6h") >= rss_growth_min_coverage and delta(rss_bytes, "6h") > 0 and rss_budget_mb * MB - rss_bytes > 0 and rss_budget_mb * MB - rss_bytes < slope(rss_bytes, "6h") * rss_exhaustion_warn_h * 3600'
severity = "warning"
confirm_cycles = 10
clear_cycles = 30
message = "FTMON RSS on course to exhaust its budget: {rss_headroom_mb:.1f} MB left at {rss_slope_mbph:.2f} MB/h"

[[rule]]
id = "rss-growth-crit"
group = "rss-growth"
when = 'coverage(rss_bytes, "6h") >= rss_growth_min_coverage and delta(rss_bytes, "6h") > 0 and rss_budget_mb * MB - rss_bytes > 0 and rss_budget_mb * MB - rss_bytes < slope(rss_bytes, "6h") * rss_exhaustion_crit_h * 3600'
severity = "error"
confirm_cycles = 10
clear_cycles = 30
message = "FTMON RSS will exhaust its budget within a day: {rss_headroom_mb:.1f} MB left at {rss_slope_mbph:.2f} MB/h"

[[rule]]
id = "event-stall"
when = 'source_activity_age_s > stall_s'
severity = "warning"
confirm_cycles = 2
message = "Event reader silent for {source_activity_age_s:.0f}s"

[[derived]]
name = "cpu_10m"
expr = 'avg(cpu_pct, "10m")'

[[derived]]
name = "rss_mb"
expr = 'rss_bytes / MB'

[[derived]]
name = "db_used_mb"
expr = 'db_used_bytes / MB'

[[derived]]
name = "rss_headroom_mb"
expr = 'rss_budget_mb - rss_bytes / MB'

[[derived]]
name = "rss_slope_mbph"
expr = 'slope(rss_bytes, "6h") * 3600 / MB'

[[derived]]
name = "rss_growth_conf"
expr = 'monot(rss_bytes, "6h")'

# Signed on purpose: retention pushing the footprint back down is the
# interesting case, and clamping at zero would erase it (DM-05).
[[derived]]
name = "db_used_slope_mbph"
expr = 'slope(db_used_bytes, "6h") * 3600 / MB'

[[derived]]
name = "db_headroom_mb"
expr = 'db_headroom_bytes / MB'

[[trend]]
id = "rss-growth"
kind = "growth"
title = "FTMON memory growth"
value_metric = "rss_mb"
value_unit = "MiB"
rate_metric = "rss_slope_mbph"
rate_unit = "MiB/hour"
confidence_metric = "rss_growth_conf"
confidence_threshold_param = "rss_growth_confidence"
incident_group = "rss-growth"

# Capacity, not growth: the question is headroom against DM-05's target, and
# the rate may legitimately be negative when retention is winning.
[[trend]]
id = "db-capacity"
kind = "capacity"
title = "FTMON database capacity"
value_metric = "db_used_mb"
value_unit = "MiB"
rate_metric = "db_used_slope_mbph"
rate_unit = "MiB/hour"
remaining_metric = "db_headroom_mb"
value_threshold_params = ["db_budget_mb", "db_warn_mb"]
incident_group = "db-budget"
